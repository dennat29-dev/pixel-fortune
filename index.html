<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080913" />
  <title>Gambler's Fortune — Arcade Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <button class="brand" data-action="go-lobby" aria-label="Go to the arcade floor">
        <span class="brand-kicker">GAMBLER'S</span>
        <span class="brand-main">FORTUNE</span>
        <span class="brand-tag">ARCADE CASINO</span>
      </button>

      <div class="topstats" id="topstats">
        <div class="stat stat-cash">
          <span class="stat-icon" data-icon="cash"></span>
          <span class="stat-copy"><span class="stat-label">CASH</span><strong id="cashValue">$300</strong></span>
        </div>
        <div class="stat stat-energy">
          <span class="stat-icon" data-icon="bolt"></span>
          <span class="stat-copy"><span class="stat-label">ENERGY</span><strong id="energyValue">20 / 20</strong></span>
          <span class="energy-bar" aria-hidden="true"><i id="energyFill"></i></span>
        </div>
        <div class="stat stat-day">
          <span class="stat-icon" data-icon="calendar"></span>
          <span class="stat-copy"><span class="stat-label">DAY</span><strong id="dayValue">1</strong></span>
        </div>
        <div class="stat stat-debt" id="debtStat">
          <span class="stat-icon" data-icon="shark"></span>
          <span class="stat-copy"><span class="stat-label">DEBT</span><strong id="debtValue">$0</strong></span>
        </div>
      </div>

      <div class="top-actions">
        <button class="profile-chip" id="profileChip" data-action="go-vault" title="Profile and vault" aria-label="Profile and vault"></button>
        <button class="icon-btn" data-action="show-help" title="How to play" aria-label="How to play">?</button>
        <button class="icon-btn" id="settingsBtn" data-action="open-settings" title="Settings" aria-label="Settings"><span data-icon="gear"></span></button>
        <button class="icon-btn" id="musicBtn" data-action="toggle-music" title="Toggle music" aria-label="Toggle music" aria-pressed="true">♫</button>
        <button class="icon-btn" id="soundBtn" data-action="toggle-sound" title="Toggle sound effects" aria-label="Toggle sound effects">♪</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-heading">
          <span>SELECT CABINET</span>
          <span class="count-pip">08</span>
        </div>
        <nav class="cabinet-nav" id="cabinetNav" aria-label="Games"></nav>
        <div class="sidebar-tools">
          <button class="rail-btn shop" data-action="go-shop" id="shopBtn">
            <span class="rail-btn-icon" data-icon="gear"></span>
            <span><b>UPGRADE DEN</b><small>Spend cash. Bend luck.</small></span>
            <span class="rail-arrow">▸</span>
          </button>
          <button class="rail-btn vault" data-action="go-vault" id="vaultBtn">
            <span class="rail-btn-icon" data-icon="diamond"></span>
            <span><b>THE VAULT</b><small id="vaultSub">Permanent unlocks</small></span>
            <span class="rail-arrow">▸</span>
          </button>
          <button class="rail-btn trophies" data-action="go-trophies" id="trophiesBtn">
            <span class="rail-btn-icon" data-icon="star"></span>
            <span><b>TROPHIES</b><small id="trophiesSub">Achievements</small></span>
            <span class="rail-arrow">▸</span>
          </button>
          <button class="rail-btn backroom" data-action="go-backroom" id="backroomBtn">
            <span class="rail-btn-icon" data-icon="revolver"></span>
            <span><b>BACK ROOM</b><small id="backroomSub">Russian roulette</small></span>
            <span class="rail-arrow" id="backroomState">🔒</span>
          </button>
        </div>
        <div class="prestige-mini" id="prestigeMini"></div>
      </aside>

      <main class="stage" id="stage" aria-live="polite"></main>

      <aside class="rightrail">
        <div id="challengePanel"></div>
        <div id="tithePanel"></div>
        <div id="debtPanel"></div>
        <div id="hustlePanel"></div>
        <div id="sleepPanel"></div>
        <div id="logPanel"></div>
      </aside>
    </div>

    <footer class="ticker">
      <div class="ticker-badge">LIVE</div>
      <div class="ticker-window"><div class="ticker-track" id="tickerTrack"></div></div>
      <div class="ticker-note">VIRTUAL CURRENCY ONLY</div>
    </footer>
  </div>

  <div class="toast-layer" id="toastLayer" aria-live="polite"></div>
  <div class="modal-layer" id="modalLayer" aria-live="polite"></div>
  <div class="sleep-overlay" id="sleepOverlay" hidden></div>
  <div class="gameover-layer" id="gameoverLayer" hidden></div>
  <div class="screen-flash" id="screenFlash" aria-hidden="true"></div>

  <script src="js/data.js?v=8"></script>
  <script src="js/canvas.js?v=8"></script>
  <script src="js/meta.js?v=8"></script>
  <script src="js/core.js?v=8"></script>
  <script src="js/ui.js?v=8"></script>
  <script src="js/games.js?v=8"></script>
  <script src="js/main.js?v=8"></script>
</body>
</html>
